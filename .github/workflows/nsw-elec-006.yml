name: NSW-ELEC public electricity data preflight
on:
  push:
    branches: [feat/nsw-elec-006-essential-zone-load]
    paths: [.github/workflows/nsw-elec-006.yml, 'tools/data-import/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect AEMO 20 Oct 2026 public zipped dispatch and generator data
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from tempfile import NamedTemporaryFile
          from zipfile import ZipFile
          from io import TextIOWrapper, BytesIO
          import os,shutil
          urls={
            'DISPATCH_SCADA': 'https://nemweb.com.au/Reports/ARCHIVE/Dispatch_SCADA/PUBLIC_DISPATCHSCADA_20261020.zip',
            'DISPATCH_IS': 'https://nemweb.com.au/Reports/ARCHIVE/DispatchIS_Reports/PUBLIC_DISPATCHIS_20261020.zip',
          }
          for key,url in urls.items():
            try:
              with NamedTemporaryFile(suffix='.zip', delete=False) as f:
                path=f.name
                with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}), timeout=90) as response:
                  print(key,'HTTP',response.status,'LENGTH',response.headers.get('content-length'))
                  shutil.copyfileobj(response, f)
              try:
                with ZipFile(path) as z:
                  print(key,'FILES',[(x.filename,x.file_size) for x in z.infolist()][:6])
                  names=[x for x in z.namelist() if x.lower().endswith('.csv')]
                  if not names:
                    inner=[x for x in z.namelist() if x.lower().endswith('.zip')]
                    if inner:
                      with ZipFile(BytesIO(z.read(inner[0]))) as nested:
                        print(key,'NESTED_FILES',nested.namelist())
                        names=[x for x in nested.namelist() if x.lower().endswith('.csv')]
                        if names:
                          with nested.open(names[0]) as raw:
                            stream=TextIOWrapper(raw,encoding='utf-8-sig',errors='replace')
                            for i in range(12): print(key,'HEAD',i,repr(next(stream).strip()[:240]))
                  else:
                    with z.open(names[0]) as raw:
                      stream=TextIOWrapper(raw,encoding='utf-8-sig',errors='replace')
                      for i in range(12): print(key,'HEAD',i,repr(next(stream).strip()[:240]))
              finally:
                os.unlink(path)
            except Exception as e:
              print(key,'FETCH_ERROR',type(e).__name__,str(e))
          PY
