name: NSW-ELEC-006 essential-data preflight

on:
  push:
    branches:
      - feat/nsw-elec-006-essential-zone-load
    paths:
      - .github/workflows/nsw-elec-006.yml
      - tools/nsw-elec-006/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public Essential Energy 2024-25 ZIP CSV schema
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from tempfile import NamedTemporaryFile
          from zipfile import ZipFile
          from io import TextIOWrapper
          import csv, os, shutil
          url = 'https://www.essentialenergy.com.au/ext/schools/EE-Zone-Substation-Load-Data-2024-25.zip'
          with NamedTemporaryFile(suffix='.zip', delete=False) as f:
              path=f.name
              with urlopen(Request(url, headers={'User-Agent':'NSWutilities-public-research/1.0'}), timeout=90) as response:
                  shutil.copyfileobj(response, f, 1024*1024)
          try:
              print('ZIP_BYTES',os.stat(path).st_size)
              with ZipFile(path) as z:
                  print('ZIP_MEMBERS',[(n.filename,n.file_size) for n in z.infolist()][:8])
                  names=[x for x in z.namelist() if x.lower().endswith('.csv')]
                  if not names: raise SystemExit('NO_CSV')
                  with z.open(names[0]) as raw:
                      f=TextIOWrapper(raw, encoding='utf-8-sig',errors='replace',newline='')
                      lines=[next(f).strip() for _ in range(4)]
                      for i,line in enumerate(lines):
                          print('HEAD',i,repr(line[:400]))
          finally:
              os.remove(path)
          PY
